name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from package.json#packageManager
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Before the tests, so a stale committed table fails fast and the suite
      # then runs against a tree the diff has just proven clean. `pnpm gen`
      # compiles tools/ itself. A runner has no %LOCALAPPDATA% dump, so the
      # generator falls back to the vendored api/ntt-100.034/ copy - the same
      # input generated.test.ts and grammar.test.ts use, checked here against
      # the real working tree rather than a scratch directory.
      - name: generated tables and grammars are up to date
        shell: bash # windows-latest defaults to pwsh, which has no `{ …; }` group
        run: |
          pnpm gen
          git diff --exit-code || { git status --porcelain; exit 1; }
      - run: pnpm test
      - run: pnpm package
      # Both runners upload: the .vsix is built on each, and a Windows-only
      # packaging failure is worth seeing as an artifact, not just a log.
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: '*.vsix'

  # The editor half of the suite: `pnpm test` above is plain Node and never
  # starts VS Code, so provider registration, the manifest wiring and
  # activation are only exercised here. Separate job, so a flaky download or a
  # missing display does not hide a unit-test failure.
  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A window that comes up but never finishes would otherwise sit here for
    # the six-hour default. A green run is well under a minute.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from package.json#packageManager
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ~330 MB of editor per run otherwise. The version here is the one in
      # test-integration/vscode-version.txt, which is what the runner reads;
      # packaging.test.ts fails if the two ever drift apart.
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-1.136.2
      # One step for both runners: Ubuntu has no display, so the editor needs
      # xvfb. A step conditional on matrix.os is what packaging.test.ts forbids,
      # hence the branch on runner.os inside bash.
      - name: pnpm test:integration
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a pnpm test:integration
          else
            pnpm test:integration
          fi
